    why: "The general rule (COB 3.3.2) applies to clients; Market Counterparties are carved out (COB 3.3.1)."
  - id: neg-best-execution-retail
    kind: negative
    cached: "Do the best execution rules apply when we trade with a Market Counterparty?"
    asked: "Do the best execution rules apply when we trade with a Retail Client?"
    why: "Best execution does not apply to Market Counterparty business; it does for Retail Clients."
