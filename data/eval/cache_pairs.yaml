# Semantic cache calibration pairs (Phase I3): src/eval/cache_eval.py
#
#   uv run python -m src.eval.cache_eval [--include-unreviewed]
#
# Each pair is a question already in the cache (`cached`) and a new one (`asked`):
#   positive  the same question in other words: serving the cached answer is right
#   negative  a near miss with a DIFFERENT correct answer (another client type,
#             entity, threshold, regime or module): serving it would be wrong
#
# The negatives are the point. Calibration picks the lowest similarity threshold
# at which no negative is served (after the citation / Defined Term / number
# guards), plus a margin. The same sweep without the guards shows what a plain
# similarity cache would have served.
#
# Drafted by Claude from data/eval/golden.yaml; `reviewed: false` until the owner
# has checked every `why` (is the answer really different?).

