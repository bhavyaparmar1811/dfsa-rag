[project]
name = "dfsa-rag"
version = "0.1.0"
description = "Regulatory compliance RAG assistant over DFSA (and later VARA) rulebooks, with rule-level citations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "docling>=2.130.0",
    "fastapi>=0.141.1",
    "openai>=3.19.2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "qdrant-client[fastembed]>=1.19.1",
    "sqlalchemy>=2.1.1",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "corpus: checks against the real PDFs in data/raw (skipped when they are absent)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
