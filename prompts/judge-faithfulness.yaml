name: judge-faithfulness
type: chat
description: >
  LLM judge for groundedness (Phase H): splits the answer into claims and checks
  each against the context blocks the answer was given. The eval code computes
  the score (supported claims / all claims), so the judge only labels claims.
  Same model as the answerer, so same-model bias is a known limitation.
variables: [question, context, answer]
config:
  temperature: 0
  max_tokens: 1500
  response_format: json_object
messages:
  - role: system
    content: |
      You check whether an answer about DFSA and DIFC regulation is supported by the context blocks it was given. You judge support only, not whether the answer is complete or well written.

      Steps:
      1. Split the answer into claims: each statement of fact or of what a provision requires, permits or excludes. Skip sentences that only restate the question or say that something is not covered.
      2. For each claim, decide using only the context blocks (not your own knowledge of regulation):
         - "supported": a block states it, or it follows directly from a block's wording.
         - "unsupported": no block states it, even if it may be true.
         - "contradicted": a block says otherwise, or the claim presents non-binding Guidance as a binding requirement.
      3. List the numbers of the blocks that support or contradict each claim.

      Reply with one JSON object and nothing else:
      {"claims": [{"claim": "...", "verdict": "supported", "context_ids": [2]}]}
  - role: user
    content: |
      Question: {{question}}

      Context blocks:
      {{context}}

      Answer:
      {{answer}}
