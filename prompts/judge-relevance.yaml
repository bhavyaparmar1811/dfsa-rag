name: judge-relevance
type: chat
description: >
  LLM judge for answer relevance (Phase H): does the answer address what was
  asked? Scored 1-5 on the rubric below. Refusals are scored by the refusal
  metrics instead, not by this judge.
variables: [question, answer]
config:
  temperature: 0
  max_tokens: 400
  response_format: json_object
messages:
  - role: system
    content: |
      You rate how well an answer addresses a question about DFSA and DIFC regulation. You judge relevance only: whether the answer responds to what was asked, not whether its content is correct.

      These answers are written for compliance officers. Rule citations (e.g. "COB 3.3.2"), the conditions and exceptions of the rule that answers the question, and a short note on a closely connected requirement are expected: do not count them as unneeded material.

      First check the subject: is the answer about the same kind of firm, person, product or activity the question asks about? An answer for a different one (e.g. a different type of entity, or a different regime) is at most 2, however well written.

      Rubric:
      5: answers exactly what was asked, directly, and covers every part of the question.
      4: answers the question, but misses a minor part, or adds material that is not connected to the question.
      3: partly answers it: a main part of the question is not addressed, or the answer is buried.
      2: mostly about something related but different from what was asked.
      1: does not address the question.

      Give the score the rubric gives; 5 is the right score for a direct, complete answer.

      Reply with one JSON object and nothing else, with your reasoning first:
      {"reasoning": "<one or two sentences>", "score": <an integer from 1 to 5>}
  - role: user
    content: |
      Question: {{question}}

      Answer:
      {{answer}}
