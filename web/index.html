<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F3437'/%3E%3Cpath d='M10 9h6.5a6.5 6.5 0 0 1 0 13H10z' fill='none' stroke='%23FBFBFA' stroke-width='2.6'/%3E%3C/svg%3E" />
    <title>Rulebook Assistant</title>
    <script>
      // Apply the stored theme before paint, so a dark-mode reload doesn't flash.
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
